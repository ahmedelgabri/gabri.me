name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by the sticky preview comment on pull requests.
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The single source of truth for "is this the production deploy?". Both the
      # build's analytics env and the deploy step read it, so they cannot drift.
      # Both flags exclude forks, where the Cloudflare secrets do not exist and
      # the deploy would only fail noisily.
      - name: Resolve deploy context
        id: context
        env:
          IS_PRODUCTION:
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
            && github.repository == 'ahmedelgabri/gabri.me' }}
          IS_PREVIEW:
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
            }}
        run: |
          {
            echo "is-production=${IS_PRODUCTION}"
            echo "is-preview=${IS_PREVIEW}"
          } >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: pnpm test:run

      - name: Run linter
        run: pnpm lint

      - name: Check formatting
        run: pnpm format --check

      - name: Type check
        run: pnpm type-check

      - name: Build
        env:
          # Analytics belongs to production only: previews and branch builds must
          # not report traffic. Layout.astro guards on truthiness, so an empty
          # value emits no GA4 markup at all. The measurement ID is public, so it
          # lives in a repository variable rather than a secret.
          GA4_TRACKING_ID:
            ${{ steps.context.outputs.is-production == 'true' &&
            vars.GA4_TRACKING_ID || '' }}
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        if: steps.context.outputs.is-production == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      # Aliases become a DNS label of the form <alias>-<worker>.<subdomain>.workers.dev,
      # so they must be lowercase alphanumerics and dashes, start with a letter and
      # fit in 63 characters alongside the worker name. The pr-<number> prefix
      # guarantees the first two and keeps the alias stable across re-pushes.
      - name: Derive preview alias
        id: alias
        if: steps.context.outputs.is-preview == 'true'
        env:
          WORKER_NAME: gabri-me
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
        run: |
          slug=$(printf '%s' "$BRANCH" | tr -c 'a-zA-Z0-9-' '-' | tr -s '-' | sed 's/^-*//; s/-*$//' | tr '[:upper:]' '[:lower:]')
          limit=$(( 63 - ${#WORKER_NAME} - 1 ))
          alias=$(printf 'pr-%s-%s' "$PR_NUMBER" "$slug" | cut -c "1-$limit" | sed 's/-*$//')
          echo "alias=${alias}" >> "$GITHUB_OUTPUT"

      - name: Upload preview version to Cloudflare Workers
        id: preview
        if: steps.context.outputs.is-preview == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Structured output beats scraping stdout for the preview URL.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          pnpm exec wrangler versions upload \
            --preview-alias "${{ steps.alias.outputs.alias }}" \
            --message "PR #${{ github.event.pull_request.number }} (${{ github.sha }})"
          url=$(node -e '
            const {readFileSync} = require("node:fs")
            const entries = readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8")
              .split("\n")
              .filter(Boolean)
              .map((line) => JSON.parse(line))
              .filter((entry) => entry.type === "version-upload")
            const last = entries.at(-1)
            process.stdout.write(last?.preview_alias_url ?? last?.preview_url ?? "")
          ')
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the pull request
        if:
          steps.context.outputs.is-preview == 'true' &&
          steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            // One sticky comment, edited on every push, rather than one per push.
            const marker = '<!-- cloudflare-preview -->'
            const body = [
              marker,
              `Preview for ${context.sha.slice(0, 7)}: ${process.env.PREVIEW_URL}`,
            ].join('\n')
            const {owner, repo} = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {owner, repo, issue_number},
            )
            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }
